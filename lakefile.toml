name = "breteche_tenenbaum_mean"
version = "0.1.0"
defaultTargets = ["BretecheTenenbaumMean", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "nair_tenenbaum"
git = "https://github.com/jasondavies/nair-tenenbaum-short-sums.git"
rev = "0f778ee8366de1204c118e212264ef096ec82b49"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "1f9b4414105d86e487a4ac4c3d3397076a44d0d2"

[[lean_lib]]
name = "BretecheTenenbaumMean"

[[lean_lib]]
name = "IwaniecLinearSieveVendor"
srcDir = "vendor/strong-pnt"
roots = ["IwaniecLinearSieveVendor.PrimeNumberTheoremAnd.StrongPNT"]
globs = ["IwaniecLinearSieveVendor.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
