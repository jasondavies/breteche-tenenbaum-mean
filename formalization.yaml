status:
  scope: >-
    The eight named targets assembled by paper_main_results in FullPaper.lean and the exact
    Parseval identity, with integrability, are proved. Challenge.lean exposes
    those eight targets and the two Parseval declarations, with complete
    definitions and no extra analytic hypotheses. The lower side of (2.5)
    is proved for x sufficiently large depending on T; the library also
    proves the sufficient quantitative range x >= exp((B*T)^4). The claim
    uniform for every x >= 2 and T >= 3 is not made and is disproved in
    RangeCheck. Historical results cited in the introduction are background,
    not additional advertised comparison targets.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["GPT-6"]
      framework: "Codex"
      tool_setup: >-
        AI agents developed the local definitions and Lean proofs, ported
        selected dependencies, ran Lean builds and the exhaustive axiom
        audit, and prepared the independent Palomar statement and metadata.
        Exact model variants for the entire development were not recorded.
      prompting_notes: >-
        The human selected arXiv:2309.03958, requested full formalization,
        supplied the Iwaniec example, authorized StrongPNT vendoring, and
        preferred limited Tau Ceti reuse when it avoided substantial duplication.
  notes: >-
    The human selected and directed the work; no human-authored proof edits
    or independent human mathematical review are claimed. Existing vendored
    developments retain their own authorship. Lean and the axiom audit check
    the proof development; the separate Comparator check compares the
    independently stated Challenge with the Solution. Deliberate Challenge
    proof holes are excluded from the status counts.

fidelity:
  divergences: >-
    The lower bound (2.5) cannot hold uniformly for every x >= 2 and T >= 3.
    The formal statement allows a cutoff depending on T, as needed by §3;
    a sufficient range x >= exp((B*T)^4) is proved and the unrestricted
    interpretation is refuted. In §2.4 the Markov denominator is theta_q,
    not theta_(q-1). The §4 product-moment argument retains its factor 4.
    The real dyadic offset is rounded to an integer, with rounding costs
    proved. Size exceptions in §3 are retained locally before taking unions;
    the proof does not assume a same-index bound for the complement of the
    simultaneous good set. High-frequency estimates retain the exact
    log(3 exp(1/psi)) envelope. Divisor windows use logarithms and the proved
    equivalent exponential convention. Delta(0)=0 handles integer roots of
    a polynomial. Parseval's literal sine quotient differs from the continuous
    sinc version only at zero, a null singleton. The polynomial argument
    uses the proved Nair–Tenenbaum short-sum input and an explicit weighted
    moment proof. Its root-count cosine estimate is derived from
    Kummer–Dedekind, Dedekind-zeta continuation/nonvanishing, and removal of
    smoothing; no prime ideal theorem is assumed. BLUEPRINT.md gives details.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Automated proof checking and AI inspection of source statements; no
    independent human review is recorded. The exhaustive axiom audit permits
    only propext, Classical.choice and Quot.sound. The submission preparation
    runs Comparator with the toolchain's Lean checker, NanoDa and con-ron;
    local execution results and any environmental limitations are recorded
    in PALOMAR.md. Mechanical success is not a claim of human peer review.

alignment:
  namespace: "BretecheTenenbaumMean"
  statements:
    - source: "Theorem 1.1"
      lean: "BretecheTenenbaumMean.theoremOne"
      module: "Challenge"
      status: "proved"
      note: "An absolute eventual bound for the ordinary first moment."
    - source: "Theorem 1.2"
      lean: "BretecheTenenbaumMean.theoremTwo"
      module: "Challenge"
      status: "proved"
      note: "Both quadratic bounds on the printed range x >= 3."
    - source: "Equation (1.7)"
      lean: "BretecheTenenbaumMean.polynomialMeanBound"
      module: "Challenge"
      status: "proved"
      note: "Every irreducible integer polynomial, including nonmonic polynomials and fixed prime divisors."
    - source: "Proposition 2.1, (2.4)"
      lean: "BretecheTenenbaumMean.propositionTwoOneUpper"
      module: "Challenge"
      status: "proved"
      note: "Uniform O(1/T) exceptional probability."
    - source: "Proposition 2.1, (2.5)"
      lean: "BretecheTenenbaumMean.propositionTwoOneLower"
      module: "Challenge"
      status: "adapted"
      note: "Necessary T-dependent lower cutoff; the unrestricted uniform statement is false."
    - source: "Proposition 2.2"
      lean: "BretecheTenenbaumMean.propositionTwoTwo"
      module: "Challenge"
      status: "proved"
      note: "All admissible thresholds, orders q >= 3, and x >= 2."
    - source: "Lemma 3.1, (3.1)"
      lean: "BretecheTenenbaumMean.lemmaThreeOne"
      module: "Challenge"
      status: "proved"
      note: "Two-sided probabilities at the dyadic logarithmic scale."
    - source: "Lemma 3.1, (3.2)"
      lean: "BretecheTenenbaumMean.lemmaThreeOneCentral"
      module: "Challenge"
      status: "proved"
      note: "Integer prime count k, with real offset t=k-h."
    - source: "Equation (2.6), convergence"
      lean: "BretecheTenenbaumMean.integrable_parseval_integrand"
      module: "Challenge"
      status: "proved"
      note: "Absolute integrability on the entire real line."
    - source: "Equation (2.6)"
      lean: "BretecheTenenbaumMean.moment_two_parseval_sine"
      module: "Challenge"
      status: "proved"
      note: "Exact 1/(2*pi) normalization and the literal sine quotient."

