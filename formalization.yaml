# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Mean value of the Erdős–Hooley Delta-function"
  description: >-
    Lean 4 formalization of de la Bretèche and Tenenbaum's mean-value
    bounds for the Erdős–Hooley divisor concentration function. The first
    moment is O(x (log log x)^(5/2)); the second moment lies between constant
    multiples of x log x and x log x (log log x)^2. The first-moment bound
    also holds along every irreducible integer polynomial. The development
    includes the exceptional-set and truncated-moment estimates, both forms
    of the prime-factor layer lemma, and the exact global Parseval identity.
    A necessary dependence of the lower-tail cutoff on the tail parameter
    is made explicit rather than asserting the false unrestricted reading.
  authors: ["Jason Davies"]
  license: "Apache-2.0"
  responsible_maintainers: ["Jason Davies"]

classification:
  arxiv: ["math.NT"]
  msc2020: ["11N37", "11K65"]

sources:
  - title: "Note on the mean value of the Erdős–Hooley Delta-function"
    authors: ["Régis de la Bretèche", "Gérald Tenenbaum"]
    id: "arXiv:2309.03958v14"
    type: "paper"
    location: "https://arxiv.org/abs/2309.03958v14"
    relationship: formalizes
    license: "unknown"
    note: >-
      Theorems 1.1 and 1.2, polynomial consequence (1.7), Propositions 2.1
      and 2.2, both forms of Lemma 3.1, and Parseval (2.6). The lower-tail
      quantification and other corrections are described in fidelity.
  - title: "An upper bound on the mean value of the Erdős–Hooley Delta function"
    authors: ["Dimitris Koukoulopoulos", "Terence Tao"]
    id: "doi:10.1112/plms.12572"
    type: "paper"
    location: "https://arxiv.org/abs/2306.08615v2"
    relationship: background
    note: >-
      The good-set exceptional estimate follows the cited argument, with
      explicit rounding, entropy remainders and the exact log(3y) envelope.

